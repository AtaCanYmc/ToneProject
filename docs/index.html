<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tone - Tactile Desktop Sound Controller</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Technical and industrial design documentation for Tone - tactile desktop sound controller.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <link rel="icon" type="image/svg+xml" href="../assets/tone-logo.svg">
  <!-- Docsify Dark Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  
  <style>
    :root {
      --theme-color: #38bdf8;
      --base-background-color: #0d1117;
      --sidebar-background: #090d13;
      --sidebar-nav-link-color: #94a3b8;
      --sidebar-nav-link-color--active: #38bdf8;
      --heading-color: #f1f5f9;
      --text-color-base: #cbd5e1;
      --code-inline-background: #1e293b;
      --code-theme-background: #161b22;
      --border-color: #21262d;
    }

    body {
      background-color: var(--base-background-color);
      color: var(--text-color-base);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .sidebar {
      background-color: var(--sidebar-background);
      border-right: 1px solid var(--border-color);
    }

    .sidebar-nav a {
      font-size: 14px;
      transition: color 0.15s ease;
    }

    .app-name-link img {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      margin-bottom: 8px;
    }

    /* Coverpage Custom Styling */
    section.cover {
      background: radial-gradient(circle at 50% 40%, #171d29 0%, #090c12 100%) !important;
    }

    section.cover .cover-main img {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      margin-bottom: 16px;
    }

    section.cover h1 {
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #f8fafc;
      margin-bottom: 8px;
    }

    section.cover h1 small {
      display: block;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 6px;
    }

    section.cover p a {
      border-radius: 24px !important;
      padding: 10px 24px !important;
      font-weight: 500;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }

    section.cover p a:last-child {
      background: #38bdf8 !important;
      color: #090d16 !important;
      border-color: #38bdf8 !important;
    }

    section.cover p a:last-child:hover {
      background: #7dd3fc !important;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
    }

    /* Markdown Elements */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .markdown-section th {
      background-color: #161b22;
      color: #f1f5f9;
      font-weight: 600;
      padding: 10px 14px;
    }

    .markdown-section td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .markdown-section tr:nth-child(2n) {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .markdown-section pre {
      background-color: var(--code-theme-background) !important;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .markdown-section code {
      border-radius: 4px;
      padding: 2px 6px;
    }

    /* Mermaid diagrams container */
    .mermaid {
      background: #11151c;
      padding: 16px;
      border-radius: 8px;
      margin: 1.5rem 0;
      text-align: center;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div id="app">Loading Tone Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Tone',
      logo: '../assets/tone-logo.svg',
      repo: 'https://github.com/AtaCanYmc/ToneProject',
      loadSidebar: true,
      subMaxLevel: 3,
      coverpage: true,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      plugins: [
        function(hook, vm) {
          hook.afterEach(function(html) {
            return html + '<footer style="margin-top: 50px; padding: 20px 0; border-top: 1px solid #21262d; font-size: 13px; color: #64748b; text-align: center;">Tone Project · Industrial Design by <a href="mailto:sezinsozden@gmail.com" style="color: #94a3b8;">Sezin Sözden</a> · Engineering by <a href="https://github.com/AtaCanYmc" target="_blank" style="color: #94a3b8;">Ata Can Yaymacı</a></footer>';
          });
        }
      ]
    };
  </script>

  <!-- Docsify Scripts -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>

  <!-- Mermaid.js for rendering flowchart and sequence diagrams -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: true, theme: 'dark' });
    window.mermaid = mermaid;
  </script>
</body>
</html>
